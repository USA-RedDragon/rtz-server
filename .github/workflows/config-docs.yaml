name: Config docs

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

jobs:
  config-docs:
    permissions:
      contents: read
    uses: USA-RedDragon/reusable-actions/.github/workflows/configulator-docs.yaml@1e6b74c455cbbe8892acc7974fac5a1ac228ad47 # v2.0.38
    with:
      dir: internal/config
      type: Config
      env-separator: __
      app-id: ${{ vars.AUTO_COMMIT_APP_ID }}
    secrets:
      app-key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
