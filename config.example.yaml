# Sample configuration
http:
  # HTTP server IPv4 host
  ipv4_host: "0.0.0.0"
  # HTTP server IPv6 host
  ipv6_host: "::"
  # HTTP server port, shared by IPv4 and IPv6
  port: 8080
  tracing:
    # Enable OpenTelemetry tracing
    enabled: false
    # OpenTelemetry collector endpoint, required when tracing is enabled
    # otlp_endpoint: ""
  # Public URL of this server
  # backend_url: ""
  pprof:
    # Enable pprof
    enabled: false
  # IP addresses or CIDR ranges of reverse proxies trusted to set X-Forwarded-For
  # trusted_proxies: []
  metrics:
    # Prometheus metrics server IPv4 host
    ipv4_host: "127.0.0.1"
    # Prometheus metrics server IPv6 host
    ipv6_host: "::1"
    # Prometheus metrics server port, shared by IPv4 and IPv6
    port: 8081
    # Enable the Prometheus metrics server
    enabled: false
  # Hosts allowed by CORS
  # cors_hosts: []
persistence:
  database:
    # Database driver, one of: sqlite, mysql, postgres
    driver: "sqlite"
    # Path to the SQLite database file, or the database name for other drivers
    database: "rtz.db"
    # Database username
    # username: ""
    # Database password
    # password: "(secret)"
    # Database host, required for mysql and postgres
    # host: ""
    # Database port, 0 uses the driver's default
    # port: 0
    # Extra parameters passed to the database driver
    # extra_parameters: ""
  uploads:
    # Storage driver for uploaded videos and driving logs, one of: filesystem, s3
    driver: "filesystem"
    filesystem_options:
      # Filesystem uploads directory, created if it does not exist
      directory: "uploads/"
    s3_options:
      # S3 region. Credentials come from the standard AWS environment variables, the AWS CLI config or an IAM role
      # region: ""
      # S3 bucket
      # bucket: ""
      # Custom S3 endpoint, which switches to path-style addressing
      # endpoint: ""
registration:
  # Enable user registration
  enabled: false
auth:
  google:
    # Enable Google OAuth
    enabled: false
    # Google OAuth client ID
    # client_id: ""
    # Google OAuth client secret
    # client_secret: "(secret)"
  github:
    # Enable GitHub OAuth
    enabled: false
    # GitHub OAuth client ID
    # client_id: ""
    # GitHub OAuth client secret
    # client_secret: "(secret)"
  custom:
    # Enable custom OAuth
    enabled: false
    # Custom OAuth client ID
    # client_id: ""
    # Custom OAuth client secret
    # client_secret: "(secret)"
    # Custom OAuth token URL
    # token_url: ""
    # Custom OAuth user URL
    # user_url: ""
jwt:
  # JWT signing secret
  # secret: "(secret)"
mapbox:
  # Mapbox secret token
  # secret_token: "(secret)"
  # Mapbox public token
  # public_token: ""
nats:
  # Enable NATS. Required when running more than one instance, such as blue/green deployments, so websockets reach the instance the device is connected to
  enabled: false
  # NATS URL
  # url: ""
  # NATS token
  # token: "(secret)"
# Number of parallel log parsers
parallel_log_parsers: 4
# Log level, one of: debug, info, warn, error
log_level: "info"
